# O plano gratuito do Supabase pausa projetos sem acesso por 7 dias.
# Este agendamento (gratuito no GitHub) faz uma consulta leve a cada 3 dias
# para manter o banco sempre ativo — útil em férias e recessos.
#
# Configure em: GitHub → Settings → Secrets and variables → Actions
#   SUPABASE_URL       = https://SEU-PROJETO.supabase.co
#   SUPABASE_ANON_KEY  = sua chave anon/publishable
name: Manter banco ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/configuracoes?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Banco ativo ✔"
